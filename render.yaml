services:
  - type: web
    name: stockai-kunhuang
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 120 backend:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
    plan: free
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
