# Railway 部署配置
# Volume 需要在 Railway Dashboard 中先创建，然后在此引用
# 创建命令: railway volume add -m /data -s 1
# 或在 Dashboard: 项目 → Volumes → Add Volume

[build]
builder = "nixpacks"
# 强制 nixpacks 使用 Python（package.json 会导致误判为 Node.js 项目）
buildCommand = "pip install -r requirements.txt"

[build.buildArgs]
NIXPACKS_PROVIDERS = "python"
NIXPACKS_NO_CACHE = "1"

[deploy]
numReplicas = 1
startCommand = "gunicorn -w 2 --timeout 120 backend:app -b 0.0.0.0:${PORT}"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

# Volume 持久化挂载（需先在 Dashboard 创建名为 data 的 volume）
# 如果 volume 尚未创建，部署会失败 — 请先在 Railway Dashboard 创建
[volumes]
  [volumes.data]
    mountPath = "/data"
    size = "1GB"
