name: Sync stock names

on:
  schedule:
    # 18:20 UTC = 02:20 Beijing time. Daily sync covers IPOs, delistings,
    # renames and ST status changes before the next trading session.
    - cron: "20 18 * * *"
  workflow_dispatch:

concurrency:
  group: sync-stock-names
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fallback data source
        run: python -m pip install --disable-pip-version-check baostock==0.8.9

      - name: Fetch current stock list
        run: python sync_stock_names.py --market cn

      - name: Validate generated modules
        run: python -m py_compile stock_names.py sync_stock_names.py

      - name: Commit changes
        run: |
          if git diff --quiet -- stock_names.py; then
            echo "Stock lists are already current"
            exit 0
          fi
          git config user.name "StockAI Sync Bot"
          git config user.email "stock-sync@stockai.local"
          git add stock_names.py
          git commit -m "chore: sync stock names"
          git push
