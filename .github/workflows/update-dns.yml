name: Update DNS to ECS

on:
  push:
    paths:
      - '.github/workflows/update-dns.yml'

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update DNS A records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          ZONE_NAME="kunhuang.top"
          NEW_IP="47.97.66.164"

          echo "=== Getting Zone ID ==="
          ZONE_RESP=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")
          echo "$ZONE_RESP" | head -c 500
          ZONE_ID=$(echo "$ZONE_RESP" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Zone ID: $ZONE_ID"

          if [ -z "$ZONE_ID" ]; then
            echo "FAILED to get Zone ID!"
            exit 1
          fi

          for NAME in "kunhuang.top" "www.kunhuang.top"; do
            echo "=== Processing $NAME ==="
            RECORD_RESP=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$NAME")
            echo "$RECORD_RESP" | head -c 300

            RECORD_ID=$(echo "$RECORD_RESP" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            OLD_IP=$(echo "$RECORD_RESP" | grep -o '"content":"[^"]*"' | head -1 | cut -d'"' -f4)

            if [ -z "$RECORD_ID" ]; then
              echo "Creating new A record for $NAME..."
              RESP=$(curl -sS -X POST \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$NEW_IP\",\"ttl\":120,\"proxied\":false}" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")
              echo "$RESP" | head -c 300
            else
              echo "Updating $NAME: $OLD_IP -> $NEW_IP"
              RESP=$(curl -sS -X PATCH \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$NEW_IP\",\"ttl\":120,\"proxied\":false}" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID")
              echo "$RESP" | head -c 300
            fi
          done

          echo "=== Done! ==="
          echo "DNS updated to $NEW_IP"
