name: Refresh Eastmoney Cache
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes during trading hours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Eastmoney data and push to ECS
        run: |
          set -e
          python3 << 'PYEOF'
          import json, urllib.request, time

          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://data.eastmoney.com/'}
          urls = {
              'sectors': 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=60&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2&fields=f2,f3,f4,f12,f14',
              'concepts': 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=60&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3&fields=f2,f3,f4,f12,f14',
              'gainers': 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=15&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f4,f12,f14,f20,f9',
              'losers': 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=15&po=0&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f4,f12,f14,f20,f9',
          }
          cache = {}
          for key, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=10)
                  data = json.loads(resp.read())
                  cache[key] = {"ts": time.time(), "data": data}
                  count = len(data.get('data', {}).get('diff', []))
                  print(f'{key}: {count} items')
              except Exception as e:
                  print(f'{key}: FAILED - {e}')

          # Push to ECS via API
          payload = json.dumps(cache).encode()
          req = urllib.request.Request('http://47.97.66.164/api/admin/cache-refresh',
              data=payload, headers={'Content-Type': 'application/json'})
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              print('Pushed to ECS:', resp.read().decode()[:100])
          except Exception as e:
              print('Push failed:', e)
          PYEOF
