name: Fix Cloudflare Proxy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-proxy-fix.yml'
  workflow_dispatch:

jobs:
  enable-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Cloudflare proxy for kunhuang.top
        run: |
          set -e
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          echo "=== Step 1: Verify token ==="
          VERIFY=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json")
          echo "Verify: $VERIFY"

          SUCCESS=$(echo "$VERIFY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success','False'))")
          echo "Token valid: $SUCCESS"

          if [ "$SUCCESS" != "True" ]; then
            echo "::warning::Token verification failed — token may be expired. Please update CLOUDFLARE_API_TOKEN in GitHub Secrets."
            # Get a fresh token from https://dash.cloudflare.com/profile/api-tokens
            # Required permissions: Zone.DNS Edit
            exit 1
          fi

          echo "=== Step 2: Get Zone ID ==="
          ZONES=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=kunhuang.top" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json")
          echo "Zones: $ZONES"

          ZONE_ID=$(echo "$ZONES" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NOT_FOUND')")
          echo "Zone ID: $ZONE_ID"

          if [ "$ZONE_ID" = "NOT_FOUND" ] || [ -z "$ZONE_ID" ]; then
            echo "::error::Zone NOT FOUND for kunhuang.top"
            exit 1
          fi

          echo "=== Step 3: Get A record ==="
          RECORDS=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=kunhuang.top&type=A" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json")
          echo "Records: $RECORDS"

          RECORD_ID=$(echo "$RECORDS" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NOT_FOUND')")
          RECORD_IP=$(echo "$RECORDS" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['content'] if r else 'N/A')")
          RECORD_PROXIED=$(echo "$RECORDS" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['proxied'] if r else 'N/A')")
          echo "Record ID: $RECORD_ID, IP: $RECORD_IP, Proxied: $RECORD_PROXIED"

          if [ "$RECORD_ID" = "NOT_FOUND" ]; then
            echo "::error::A record NOT FOUND for kunhuang.top"
            exit 1
          fi

          if [ "$RECORD_PROXIED" = "True" ]; then
            echo "::notice::Proxy already enabled! No change needed."
            exit 0
          fi

          echo "=== Step 4: Enable proxy ==="
          UPDATE=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"proxied":true}')
          echo "Update: $UPDATE"

          UPDATE_SUCCESS=$(echo "$UPDATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success','False'))")
          NEW_PROXIED=$(echo "$UPDATE" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',{}); print(r.get('proxied','N/A'))")

          echo ""
          echo "========================================"
          if [ "$UPDATE_SUCCESS" = "True" ] && [ "$NEW_PROXIED" = "True" ]; then
            echo "SUCCESS! Cloudflare proxy is now ENABLED"
            echo "kunhuang.top will now route through Cloudflare CDN"
            echo "Changes propagate in 1-5 minutes"
          else
            echo "FAILED: Update success=$UPDATE_SUCCESS, proxied=$NEW_PROXIED"
            exit 1
          fi
