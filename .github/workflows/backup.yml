name: Daily Backup

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 0

      - name: Generate backup token
        id: token
        env:
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          TOKEN=$(echo -n "${FLASK_SECRET_KEY}backup" | sha256sum | cut -c1-32)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Download backup
        run: |
          curl -s -o backup.zip --connect-timeout 30 --max-time 120 \
            -H "X-Backup-Token: ${{ steps.token.outputs.token }}" \
            "https://stock-analysis-app-production-da60.up.railway.app/api/admin/backup"
          if [ -s backup.zip ] && file backup.zip | grep -q "Zip archive"; then
            echo "Backup OK ($(wc -c < backup.zip) bytes)"
            unzip -o backup.zip -d backup_data/
          else
            echo "Backup failed"
            head -5 backup.zip
            exit 1
          fi

      - name: Commit to backups branch
        run: |
          rm -rf backup_data/backups
          mkdir -p archive
          cp backup_data/app.db archive/app_${{ steps.token.outputs.date }}.db 2>/dev/null || true
          cp backup_data/*.json archive/ 2>/dev/null || true

          # Keep last 30 days only
          ls -t archive/app_*.db 2>/dev/null | tail -n +31 | xargs rm -f 2>/dev/null || true
          ls -t archive/env_*.json 2>/dev/null | tail -n +31 | xargs rm -f 2>/dev/null || true

          git config user.name "Backup Bot"
          git config user.email "backup@stockai.local"
          git add archive/ backup_data/
          git commit -m "Backup ${{ steps.token.outputs.date }}" || echo "No changes"
          git push origin backups || git push origin backups --force
